[project]
name = "ocmt"
version = "0.1.0"
description = "Multi-tenant LLM architecture with Markdown memory and Claude Code CLI execution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
channels = ["python-telegram-bot>=21", "discord.py>=2.4", "slack-bolt>=1.21"]
embeddings = ["sentence-transformers>=3.0", "numpy>=2.0"]
api-fallback = ["anthropic>=0.42"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28"]

[project.scripts]
ocmt = "ocmt.main:cli_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
