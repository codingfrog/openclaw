# OCMT global configuration
#
# COMPLIANCE NOTE (https://code.claude.com/docs/en/legal-and-compliance):
#   Developers building products/services MUST use API key authentication
#   (via Claude Console or a supported cloud provider). OAuth tokens from
#   Free/Pro/Max plans must NOT be used to route requests for third-party
#   users. Set agents.cli.api_key below, or provide per-tenant API keys
#   when creating tenants.

database:
  path: "ocmt.sqlite"

tenant_workspace_root: "data/tenants"

agents:
  default_model: "sonnet"
  fallback_models:
    - "haiku"
  cli:
    command: "claude"
    timeout_ms: 120000
    no_output_timeout_ms: 60000
    serialize: true
    # Global Anthropic API key. Per-tenant keys override this.
    # Get one at https://console.anthropic.com/
    api_key: ""  # or set ANTHROPIC_API_KEY env var

memory:
  chunk_tokens: 400
  chunk_overlap: 80
  max_results: 6
  min_score: 0.35
  vector_weight: 0.7
  text_weight: 0.3
  temporal_decay_enabled: false
  temporal_decay_half_life_days: 30

api:
  host: "0.0.0.0"
  port: 8000
